    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; }
      #app { position: fixed; inset: 0; }
      #attribution {
        position: fixed; right: 6px; bottom: 4px; max-width: calc(100vw - 24px);

        padding: 2px 6px;

      #attribution a { color: #0d47a1; }
      #error {
        position: fixed; left: 50%; top: 40%; transform: translateX(-50%);
        font: 16px sans-serif; background: #fff; color: #b71c1c; padding: 12px 16px;
        border: 1px solid #b71c1c; max-width: 80vw;
      }
