name: visual-baselines

# Manual only: produces the Linux visual-regression baselines as a downloadable artifact.
# It never pushes commits (see web/e2e/visual.spec.ts-snapshots/README.md).
permissions:
  contents: read

"on":
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: npm install -g npm@11.19.1
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build web
        run: npm --prefix web run build
      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Generate Linux baselines
        working-directory: web
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
        env:
          CI: ""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-linux
          path: web/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
